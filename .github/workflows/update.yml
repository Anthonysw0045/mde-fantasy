name: update-data
on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 (GitHub 사정으로 몇 분 지연될 수 있음)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: commit if changed
        run: |
          git config user.name "mde-bot"
          git config user.email "mde-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "data: $(date -u +%FT%TZ)" && git push)
