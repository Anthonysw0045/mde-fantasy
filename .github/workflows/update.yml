name: update-data
# 갱신 방식 (2026-10-19): GitHub 예약 실행(schedule)이 새 저장소에서 1.5시간 넘게 한 번도 돌지 않아
# '이어달리기'로 전환 — 실행이 끝나면 다음 실행을 스스로 띄운다 (외부 서비스·토큰 불필요, 무료).
#   NBA 경기 시간대(미국 동부 17시~다음날 01시 = KST 06~14시, 서머타임 종료 후 07~15시): 약 5분 간격
#   그 외 시간: 약 1시간 간격
# schedule 은 이어달리기가 끊겼을 때 되살리는 보조 장치.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: mde-chain          # 실행 1개 + 대기 1개만 유지 → 이어달리기가 겹쳐도 중복되지 않음
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: docs/proj_cache.json
          key: proj-${{ github.run_id }}
          restore-keys: proj-
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: wait then start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "$H" -ge 17 ] || [ "$H" -lt 1 ]; then W=240; else W=3300; fi
          echo "ET hour $H -> sleep $W s"
          sleep $W
          gh workflow run update.yml --ref main
