<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDE 판타지 현황판</title>
<meta name="description" content="MDE 판타지 농구 리그 실시간 매치업·순위">
<meta property="og:title" content="MDE 판타지 현황판">
<meta property="og:description" content="이번 주 매치업 · 카테고리 점수 · 순위 실시간">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --muted:#6b7280; --line:#e5e7eb;
  --a:#0a84ff; --a-soft:#e6f1ff; --b:#ff5a36; --b-soft:#ffece6; --tie:#9ca3af; --accent:#111827;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --card:#171b22; --ink:#e8eaee; --muted:#9aa3af; --line:#262c36;
    --a:#4ea1ff; --a-soft:#13243a; --b:#ff7a5c; --b-soft:#3a1c15; --tie:#6b7280; --accent:#e8eaee;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --ink:#e8eaee; --muted:#9aa3af; --line:#262c36;
  --a:#4ea1ff; --a-soft:#13243a; --b:#ff7a5c; --b-soft:#3a1c15; --tie:#6b7280; --accent:#e8eaee;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header h1{font-size:20px;margin:4px 0 2px}
header .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 6px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;font-size:14px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.seg{display:flex;gap:4px;margin:8px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px 0;border-radius:8px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:6px 2px 10px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team.r{flex-direction:row-reverse;text-align:right}
.team img{width:34px;height:34px;border-radius:50%;flex:none;background:var(--line)}
.tn{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{color:var(--muted);font-size:12px}
.score{font-size:24px;font-weight:700;letter-spacing:1px;text-align:center;white-space:nowrap}
.score .x{color:var(--a)} .score .y{color:var(--b)} .score .d{color:var(--muted);font-size:16px;margin:0 4px}
.cats{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:10px}
.cat{text-align:center;border-radius:6px;padding:4px 0 3px;background:var(--bg);font-size:10px;color:var(--muted)}
.cat b{display:block;font-size:11px;color:var(--ink);font-weight:600}
.cat.a{background:var(--a-soft)} .cat.a b{color:var(--a)}
.cat.b{background:var(--b-soft)} .cat.b b{color:var(--b)}
details{margin-top:8px} summary{cursor:pointer;color:var(--muted);font-size:12px}
.stbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.stbl td,.stbl th{padding:4px 2px;text-align:center;border-bottom:1px solid var(--line)}
.stbl th{color:var(--muted);font-weight:500}
.stbl td.w{font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
.tbl td.nm{text-align:left;max-width:0;width:50%}
.tbl td.nm div{display:flex;align-items:center;gap:8px;overflow:hidden}
.tbl td.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl img{width:24px;height:24px;border-radius:50%;flex:none}
.rk{font-weight:700;width:28px}
.po td{background:color-mix(in srgb,var(--a-soft) 55%,transparent)}
.note{color:var(--muted);font-size:12px;margin:8px 2px}
.tx{list-style:none;padding:0;margin:0}
.tx li{padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.err{color:var(--b)}
a{color:inherit}
.pts{font-size:22px;font-weight:700;color:var(--muted)} .pts.lead{color:var(--a)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--line)}
.tag.a{background:var(--a-soft);color:var(--a)} .tag.b{background:var(--b-soft);color:var(--b)}
.blk{margin-top:10px;padding:8px 10px 10px;border-radius:10px;border:1px solid var(--line)}
.blk.proj{background:var(--bg);border-style:dashed}
.bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.lab{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.blk.live .lab::before{content:"●";color:#22c55e;margin-right:4px;font-size:9px;vertical-align:1px}
.blk.proj .lab::before{content:"◇";margin-right:4px}
.bs{font-size:16px;font-weight:700}
.who{font-size:12px;margin-left:auto} .who .ca{color:var(--a)} .who .cb{color:var(--b)}
.mutedtxt{color:var(--muted);font-weight:500;font-size:13px}
.blk .cats{margin-top:8px} .bf{margin-top:6px}
.stbl .pjc{color:var(--muted);font-style:italic}
.stbl td.pjc.w{color:var(--ink);font-weight:700}
.hh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.hh .pill{margin-left:auto}
.htbl td,.htbl th{font-size:13px}.htbl td.nm2{text-align:left;font-size:13px;line-height:1.3}
.ok{color:#22c55e;font-weight:700}.no{color:var(--b);font-weight:700}
.hs{display:flex;align-items:baseline;gap:10px}.hs b{font-size:22px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.rgrid .card{margin:0}
.rtbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}.rtbl td{padding:4px 3px;border-bottom:1px solid var(--line)}
.rtbl td.sl{width:34px;color:var(--muted);font-size:11px}.rtbl td.pn{font-weight:500}
.rtbl tr.bn td.pn,.rtbl tr.il td.pn{color:var(--muted);font-weight:400}
.edge{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.edge span{color:var(--muted);font-size:12px} .edge em{font-style:normal;font-weight:700}
.edge.a b,.edge.a em{color:var(--a)} .edge.b b,.edge.b em{color:var(--b)}
.edge i{font-style:normal;color:var(--muted);font-size:12px;width:100%}
.cat.pj{opacity:.75} .cat.cl{outline:1px dashed var(--muted);outline-offset:-2px}
.stbl td.mu{color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;margin:20px 0 8px}
@media (max-width:420px){.cats{grid-template-columns:repeat(9,1fr);gap:2px}.cat{font-size:9px}.cat b{font-size:10px}.score{font-size:21px}.tn{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏀 MDE 판타지 현황판</h1>
    <div class="sub" id="upd">불러오는 중…</div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="seg" id="seg">
    <button data-v="mu" class="on">이번 주 매치업</button>
    <button data-v="st">순위</button>
    <button data-v="hx">예상 적중</button>
    <button data-v="ro">로스터</button>
    <button data-v="tx">거래 기록</button>
  </div>
  <main id="main"></main>
  <footer>데이터: Yahoo Fantasy 공개 리그 · 실제 점수 약 5분마다 갱신 · 주간 예상은 주차 시작 전 작성</footer>
</div>
<script>
const PAGE_VER="20261019-6";  // 화면 수정 시 올림 → 옛 화면이 캐시된 폰은 자동 새로고침
const CATS=["FG%","FT%","3PTM","PTS","REB","AST","ST","BLK","TO"];
const LBL={"3PTM":"3PM"};
const S={data:null,lg:0,view:"mu"};
try{const q=JSON.parse(localStorage.getItem("mde_ui")||"{}");Object.assign(S,{lg:q.lg||0,view:q.view||"mu"})}catch(e){}
const save=()=>{try{localStorage.setItem("mde_ui",JSON.stringify({lg:S.lg,view:S.view}))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stLabel=s=>({"Not started yet":"시작 전","In progress":"진행 중","Final":"종료"}[s]||s||"");

async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    S.data=await r.json();
    if(S.data.page_ver&&S.data.page_ver!==PAGE_VER&&!location.search.includes("v="+S.data.page_ver)){location.replace(location.pathname+"?v="+S.data.page_ver);return}
    render();
  }catch(e){document.getElementById("main").innerHTML='<p class="err">데이터를 불러오지 못했습니다.</p>'}
}
function render(){
  const d=S.data; if(!d) return;
  if(S.lg>=d.leagues.length) S.lg=0;
  document.getElementById("upd").textContent="마지막 갱신 "+d.updated;
  document.getElementById("tabs").innerHTML=d.leagues.map((l,i)=>`<button class="${i==S.lg?"on":""}" data-i="${i}">${esc(l.name)}</button>`).join("");
  document.getElementById("tabs").style.display=d.leagues.length>1?"flex":"none";
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.v==S.view));
  const L=d.leagues[S.lg], M=document.getElementById("main");
  if(L.error){M.innerHTML=`<div class="card err">${esc(L.name)} — 불러오기 실패: ${esc(L.error)}</div>`;return}
  const meta=`<div class="meta"><span><b>${L.week?L.week+"주차":""}</b> <span class="pill">${esc(stLabel(L.status))}</span></span><a href="${esc(L.url)}" target="_blank" rel="noopener">Yahoo에서 보기 ↗</a></div>`+(L.proj_asof&&S.view=="mu"?`<p class="note" style="margin-top:-4px">● 현재 = Yahoo 실제 경기 기록(약 5분마다 갱신) · ◇ 주간 예상 = 주차 시작 전에 양 팀 모두 풀 출전을 가정해 작성, 주중에는 고정 (작성 ${esc(L.proj_asof)} KST)</p>`:"");
  if(S.view=="mu") M.innerHTML=meta+L.matchups.map(L.type=="points"?muPts:mu).join("");
  else if(S.view=="st") M.innerHTML=meta+standings(L);
  else if(S.view=="hx") M.innerHTML=meta+history(L);
  else if(S.view=="ro") M.innerHTML=meta+rosters(L);
  else M.innerHTML=meta+(L.transactions.length?`<div class="card"><ul class="tx">${L.transactions.map(txItem).join("")}</ul></div><p class="note">최근 거래만 표시 · 시각은 Yahoo 표기(미국 시간)</p>`:`<div class="card note">아직 거래 기록이 없습니다.</div>`);
}
function teamHtml(t,right){
  return `<div class="team ${right?"r":""}"><img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div style="min-width:0"><div class="tn">${esc(t.name)}</div><div class="rec">${esc(t.record)}</div></div></div>`;
}
function chipRow(cs,close,proj){
  return `<div class="cats">${CATS.map(k=>{const w=cs[k];const cl=close&&close.includes(k);
    return `<div class="cat ${w=="a"?"a":w=="b"?"b":""} ${proj?"pj":""} ${cl?"cl":""}"><b>${LBL[k]||k}</b>${w=="a"?"◀":w=="b"?"▶":w=="tie"?"=":"·"}</div>`}).join("")}</div>`;
}
function blk(lab,cls,score,who,body,foot){
  return `<div class="blk ${cls}"><div class="bh"><span class="lab">${lab}</span><span class="bs">${score}</span>${who?`<span class="who">${who}</span>`:""}</div>${body||""}${foot||""}</div>`;
}
function leadName(x,y,a,b,cls){return x==y?`<span>박빙</span>`:`<span class="${x>y?"ca":"cb"}">${esc(x>y?a.name:b.name)} 우세</span>`}
function mu(m){
  const [a,b]=m.teams, c=m.cats||{}, pc=m.pcats||{};
  const started=Object.values(c).some(v=>v);
  const sc=started?`<span class="x">${a.cw}</span><span class="d">-</span><span class="y">${b.cw}</span>`:`<span class="d">vs</span>`;
  const live=started
    ?blk("현재 · 실제 경기","live",`${a.cw} - ${b.cw}${m.ties?` (무 ${m.ties})`:""}`,leadName(a.cw,b.cw,a,b),chipRow(c))
    :blk("현재 · 실제 경기","live",`<span class="mutedtxt">경기 시작 전</span>`,"","");
  let pj="";
  if(m.pcats){
    const close=m.pclose||[];
    pj=blk("주간 예상 · 주차 시작 전 작성","proj",`${a.pcw} - ${b.pcw}`,leadName(a.pcw,b.pcw,a,b),chipRow(pc,close,true),
      `<div class="rec bf">${close.length?`접전(점선): ${close.map(k=>LBL[k]||k).join(" · ")} · `:""}풀 출전 가정 · 출전 ${a.prem_games} : ${b.prem_games}경기</div>`);
  }
  const fmt=(k,v)=>v==null||v===""?"-":(k=="FG%"||k=="FT%")&&typeof v=="number"?v.toFixed(3).replace(/^0/,""):v;
  const rows=CATS.map(k=>{const w=c[k],wp=pc[k];
    return `<tr><td class="${wp=="a"?"w":""} pjc">${fmt(k,(a.pstats||{})[k])}</td><td class="${w=="a"?"w":""}">${esc((a.stats||{})[k]??"-")}</td><th>${LBL[k]||k}</th><td class="${w=="b"?"w":""}">${esc((b.stats||{})[k]??"-")}</td><td class="${wp=="b"?"w":""} pjc">${fmt(k,(b.pstats||{})[k])}</td></tr>`}).join("");
  return `<div class="card"><div class="vs">${teamHtml(a)}<div class="score">${sc}</div>${teamHtml(b,true)}</div>
    ${live}${pj}
    <details><summary>카테고리 상세</summary><table class="stbl"><tr><th class="pjc">주간 예상</th><th>현재</th><th></th><th>현재</th><th class="pjc">주간 예상</th></tr>${rows}</table></details></div>`;
}
const KIND={add:["영입","a"],drop:["방출","b"],trade:["트레이드",""],etc:["",""]};
function txItem(t){
  const mv=(t.moves||[]).map(m=>{const [k,c]=KIND[m.kind]||KIND.etc;return `<div><span class="tag ${c}">${k}</span> <b>${esc(m.player)}</b> <span class="rec">${esc(m.pos)}</span></div>`}).join("");
  return `<li>${mv}<div class="rec">${esc((t.teams||[]).join(" ↔ "))} · ${esc(t.time)}</div></li>`;
}
function muPts(m){
  const [a,b]=m.teams, x=parseFloat(a.score)||0, y=parseFloat(b.score)||0, started=x>0||y>0;
  const pa=a.pproj, pb=b.pproj, hasP=pa!=null&&pb!=null;
  const num=v=>v==null?"-":Number(v).toLocaleString("ko-KR",{maximumFractionDigits:1});
  const sc=started?`<span class="x">${num(x)}</span><span class="d">-</span><span class="y">${num(y)}</span>`:`<span class="d">vs</span>`;
  const live=started?blk("현재 · 실제 경기","live",`${num(x)} - ${num(y)}`,leadName(x,y,a,b),"")
                    :blk("현재 · 실제 경기","live",`<span class="mutedtxt">경기 시작 전</span>`,"","");
  const stl=(t)=>(t.pstarters||[]).map(p=>`${esc(p.name)} ${num(p.v)}${p.n?` (${p.n}경기)`:""}`).join(" · ");
  const pj=hasP?blk("주간 예상 · 주차 시작 전 작성 · 최고 1경기 규칙","proj",`${num(pa)} - ${num(pb)}`,
      pa==pb?`<span>박빙</span>`:`<span class="${pa>pb?"ca":"cb"}">${esc(pa>pb?a.name:b.name)} +${num(Math.abs(pa-pb))}점</span>`,"",
      (a.pstarters?`<details class="bf"><summary>예상 주전 6명과 기대 최고점</summary><div class="rec" style="margin-top:4px"><b>${esc(a.name)}</b>: ${stl(a)}</div><div class="rec" style="margin-top:4px"><b>${esc(b.name)}</b>: ${stl(b)}</div></details>`:""))
    :blk("예상 (Yahoo)","proj",`${esc(a.proj||"-")} - ${esc(b.proj||"-")}`,"","");
  return `<div class="card"><div class="vs">${teamHtml(a)}<div class="score">${sc}</div>${teamHtml(b,true)}</div>${live}${pj}</div>`;
}
function history(L){
  const fmt=v=>L.type=="points"?Number(v).toLocaleString("ko-KR",{maximumFractionDigits:1}):v;
  const H=L.history||{}, weeks=Object.keys(H).map(Number).sort((x,y)=>y-x);
  let hit=0,tot=0; weeks.forEach(w=>H[w].rows.forEach(r=>{tot++;if(r.hit)hit++}));
  const row=(a,b,p,r,mark)=>`<tr><td class="nm2">${esc(a)}<br><span class="rec">vs ${esc(b)}</span></td><td>${fmt(p[0])} - ${fmt(p[1])}</td><td>${r}</td><td>${mark}</td></tr>`;
  const head=`<tr><th style="text-align:left">매치업</th><th>주간 예상</th><th>실제 결과</th><th></th></tr>`;
  let cur="";
  if(L.week&&(L.matchups||[]).some(m=>m.teams[0].pcw!=null||m.teams[0].pproj!=null)){
    const rows=L.matchups.map(m=>{const [a,b]=m.teams;const p=L.type=="points"?[a.pproj,b.pproj]:[a.pcw,b.pcw];
      const live=L.type=="points"?`${fmt(parseFloat(a.score)||0)} - ${fmt(parseFloat(b.score)||0)}`:(m.cats&&Object.values(m.cats).some(v=>v)?`${a.cw} - ${b.cw}`:"-");
      return row(a.name,b.name,p,`<span class="rec">${live}</span>`,`<span class="rec">진행</span>`)}).join("");
    cur=`<div class="card"><div class="hh"><b>${L.week}주차</b><span class="rec">진행 중 · 예상 작성 ${esc(L.proj_asof||"")}</span></div><table class="tbl htbl">${head}${rows}</table></div>`;
  }
  const past=weeks.map(w=>{const h=H[w],n=h.rows.length,k=h.rows.filter(r=>r.hit).length;
    return `<div class="card"><div class="hh"><b>${w}주차</b><span class="rec">예상 작성 ${esc(h.asof)}</span><span class="pill">적중 ${k}/${n}</span></div><table class="tbl htbl">${head}${h.rows.map(r=>row(r.a,r.b,r.proj,`${fmt(r.result[0])} - ${fmt(r.result[1])}`,r.hit?'<span class="ok">✓</span>':'<span class="no">✗</span>')).join("")}</table></div>`}).join("");
  const sum=tot?`<div class="card hs"><span>시즌 누적 적중률</span><b>${Math.round(hit/tot*100)}%</b><span class="rec">${hit} / ${tot} 매치업</span></div>`:`<p class="note">주차가 끝나면 처음 작성한 주간 예상과 실제 결과를 비교해 여기에 쌓습니다.</p>`;
  return sum+cur+past;
}
const FLAG={Q:"출전 불투명",O:"결장",OFS:"시즌아웃",INJ:"부상",GTD:"당일 결정",DTD:"매일 체크",P:"출전 유력",D:"출전 의문"};
function rosters(L){
  const R=L.rosters; if(!R) return `<div class="card note">로스터를 아직 불러오지 못했습니다.</div>`;
  const cards=L.standings.map(t=>{const rows=(R[t.id]||[]).map(p=>`<tr class="${p.slot.startsWith("IL")?"il":p.slot=="BN"?"bn":""}"><td class="sl">${esc(p.slot)}</td><td class="pn">${esc(p.name)}${p.flag?` <span class="tag b" title="${esc(FLAG[p.flag]||p.flag)}">${esc(p.flag)}</span>`:""}</td><td class="rec">${esc(p.nba)}</td><td class="rec">${esc(p.pos)}</td></tr>`).join("");
    return `<div class="card"><div class="team"><img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="tn">${esc(t.name)}</div></div><table class="rtbl">${rows}</table></div>`}).join("");
  return `<p class="note">현재 로스터 (약 1시간마다 갱신 · ${esc(L.rosters_asof||"")} KST) · 회색 = 벤치/IL · 빨간 표시 = 부상 상태</p><div class="rgrid">${cards}</div>`;
}
function standings(L){
  const ranked=L.standings.some(t=>t.rank);
  const rows=L.standings.map((t,i)=>`<tr class="${ranked&&i<6?"po":""}"><td class="rk">${esc(t.rank||"-")}</td><td class="nm"><div><img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span>${esc(t.name)}</span></div></td><td>${esc(t.wlt)}</td><td>${esc(L.type=="points"?t.pts:t.gb)}</td><td>${esc(t.waiver)}</td><td>${esc(t.moves)}</td></tr>`).join("");
  const third=L.type=="points"?["누적점수","pts"]:["GB","gb"];
  return `<div class="card" style="padding:6px 8px"><table class="tbl"><thead><tr><th>#</th><th style="text-align:left">팀</th><th>승-패-무</th><th>${third[0]}</th><th>웨이버</th><th>영입</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">${ranked?"음영 = 플레이오프권(상위 6팀) · ":"시즌 시작 전 — 순위 미정 · "}웨이버 = 우선순위(1이 최우선)</p>`;
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(b){S.lg=+b.dataset.i;save();render()}};
document.getElementById("seg").onclick=e=>{const b=e.target.closest("button");if(b){S.view=b.dataset.v;save();render()}};
load(); setInterval(load,5*60*1000);
</script>
</body>
</html>
